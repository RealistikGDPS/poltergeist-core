[project]
name = "poltergeist-core"
version = "0.1.0"
description = "The shared adapters, resources and services of a Poltergeist Geometry Dash server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RealistikDash" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "bcrypt>=5.0.0",
    "beerstream1 @ https://github.com/RealistikGDPS/BeerStream1/releases/download/v0.1.0/beerstream1-0.1.0-cp314-cp314-manylinux_2_28_x86_64.whl ; platform_machine == 'x86_64'",
    "beerstream1 @ https://github.com/RealistikGDPS/BeerStream1/releases/download/v0.1.0/beerstream1-0.1.0-cp314-cp314-manylinux_2_28_aarch64.whl ; platform_machine == 'aarch64'",
    "beerstream2 @ https://github.com/RealistikGDPS/BeerStream2/releases/download/v0.1.0/beerstream2-0.1.0-cp314-cp314-manylinux_2_28_x86_64.whl ; platform_machine == 'x86_64'",
    "beerstream2 @ https://github.com/RealistikGDPS/BeerStream2/releases/download/v0.1.0/beerstream2-0.1.0-cp314-cp314-manylinux_2_28_aarch64.whl ; platform_machine == 'aarch64'",
    "cryptography>=46.0.5",
    "gdformat>=0.2.4",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "uvloop>=0.22.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pre-commit>=4",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "RUF",
    "SIM",
    "TID",
    "UP",
    "W",
]
ignore = [
    "RUF012",
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
strict = true
warn_unreachable = true
# Packages re-export their public surface from __init__.py by plain import.
implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncmy", "asyncmy.*", "uvloop"]
ignore_missing_imports = true
